<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AEGIS-ADS | Admin</title>
<style>:root{--bg:#0a0e14;--card:#12171f;--border:#2a3a4a;--text:#e0e0e0;--muted:#9baec8;--blue:#2979ff;--red:#ff5252;--green:#4caf50;}
*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg);font-family:'Segoe UI',sans-serif;color:var(--text);display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;}
.sidebar-header{padding:20px;text-align:center;border-bottom:1px solid var(--border);}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--muted);text-decoration:none;font-size:13px;border-left:3px solid transparent;}
.sidebar-nav a:hover,.sidebar-nav a.active{background:#1a2230;color:#fff;border-left-color:var(--blue);}
.main{margin-left:250px;flex:1;padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:10px;background:#1a2230;color:var(--muted);font-size:10px;text-transform:uppercase;}
td{padding:10px;border-top:1px solid var(--border);}
.btn{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:11px;}
.btn-blue{background:var(--blue);color:#fff;}.btn-red{background:var(--red);color:#fff;}
</style></head>
<body>
<aside class="sidebar">
<div class="sidebar-header"><h2>🛡️ AEGIS-ADS</h2></div>
<nav class="sidebar-nav">
<a href="/dashboard">📊 Dashboard</a><a href="/firewall">🛡️ Firewall</a><a href="/logs">📋 Logs</a>
<a href="/models">🤖 AI Models</a><a href="/devices">🌐 Devices</a><a href="/pcap">📁 PCAP</a>
<a href="/admin" class="active">👥 Users</a><a href="/settings">⚙️ Settings</a><a href="/reports">📄 Reports</a>
<a href="/about">ℹ️ About</a><a href="/" onclick="localStorage.clear()" style="color:var(--red);">🚪 Logout</a>
</nav></aside>
<main class="main">
<h1>👥 User Management</h1>
<div class="card" style="margin-top:20px;">
<h3 style="color:var(--muted);margin-bottom:10px;">System Users</h3>
<table><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
<tr><td>1</td><td>admin</td><td><span style="color:var(--blue);">SuperAdmin</span></td><td>alaxhmood@gmail.com</td><td><span style="color:var(--green);">Active</span></td><td><button class="btn btn-blue">Edit</button> <button class="btn btn-red">Disable</button></td></tr>
<tr><td>2</td><td>analyst</td><td>Analyst</td><td>analyst@aegis.local</td><td><span style="color:var(--green);">Active</span></td><td><button class="btn btn-blue">Edit</button> <button class="btn btn-red">Disable</button></td></tr>
</tbody></table>
<button class="btn btn-blue" style="margin-top:15px;">➕ Add New User</button>
</div>
</main>
</body>
</html>
