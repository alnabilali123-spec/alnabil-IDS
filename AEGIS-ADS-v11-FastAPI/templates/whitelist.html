<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AEGIS-ADS | القائمة البيضاء</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: rgba(10, 10, 30, 0.95);
            border-right: 1px solid rgba(100, 100, 200, 0.3);
            padding: 20px 0;
            position: fixed;
            height: 100vh;
        }
        .logo { text-align: center; padding: 20px; border-bottom: 1px solid rgba(100,100,200,0.3); }
        .logo h1 { font-size: 24px; background: linear-gradient(90deg, #00d4ff, #7c4dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { list-style: none; padding: 0 15px; }
        .nav-menu li a { display: flex; padding: 12px 15px; color: #ccc; text-decoration: none; border-radius: 10px; gap: 12px; }
        .nav-menu li a:hover { background: rgba(100,100,200,0.2); color: #fff; }
        .nav-menu li.active a { background: linear-gradient(90deg, #00d4ff, #7c4dff); color: #fff; }
        .main-content { flex: 1; margin-left: 260px; padding: 30px; }
        .card { background: rgba(20,20,50,0.8); border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(100,100,200,0.2); }
        .card h2 { color: #00d4ff; margin-bottom: 15px; border-bottom: 1px solid rgba(100,100,200,0.2); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(100,100,200,0.3); border-radius: 8px; color: #fff; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(90deg, #00d4ff, #7c4dff); color: #fff; font-weight: bold; }
        .btn-danger { background: linear-gradient(90deg, #d50000, #ff5722); }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th, .data-table td { padding: 10px; text-align: center; border-bottom: 1px solid rgba(100,100,200,0.2); }
        .data-table th { background: rgba(0,212,255,0.1); color: #00d4ff; }
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; background: #4caf50; color: white; z-index: 1000; animation: fadeOut 3s; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="logo"><h1>AEGIS-ADS</h1><p>v11.0</p></div>
        <ul class="nav-menu">
            <li><a href="/dashboard">📊 Dashboard</a></li>
            <li><a href="/firewall">🔥 Firewall</a></li>
            <li><a href="/logs">📜 Logs</a></li>
            <li><a href="/models">🤖 AI Models</a></li>
            <li><a href="/devices">📱 Devices</a></li>
            <li><a href="/pcap">📦 PCAP</a></li>
            <li><a href="/users">👥 Users</a></li>
            <li><a href="/settings">⚙️ Settings</a></li>
            <li><a href="/reports">📄 Reports</a></li>
            <li class="active"><a href="/whitelist">✅ Whitelist</a></li>
            <li><a href="/about">ℹ️ About</a></li>
            <li><a href="/logout">🚪 Logout</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="card">
            <h2>➕ إضافة عنوان IP إلى القائمة البيضاء</h2>
            <div class="form-group">
                <input type="text" id="whitelistIp" placeholder="مثال: 192.168.137.100" dir="ltr">
            </div>
            <button class="btn" onclick="addToWhitelist()">إضافة IP</button>
        </div>
        <div class="card">
            <h2>✅ العناوين البيضاء (لن يتم حظرها)</h2>
            <table class="data-table" id="whitelistTable">
                <thead><tr><th>IP Address</th><th>إجراء</th></tr></thead>
                <tbody id="whitelistBody"><tr><td colspan="2">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
    async function loadWhitelist() {
        const res = await fetch('/api/whitelist');
        const data = await res.json();
        const tbody = document.getElementById('whitelistBody');
        if (data.ips.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2">لا توجد عناوين بيضاء</td></tr>';
            return;
        }
        tbody.innerHTML = data.ips.map(ip => `
            <tr>
                <td>${ip}</td>
                <td><button class="btn btn-danger" onclick="removeFromWhitelist('${ip}')">حذف</button></td>
            </tr>
        `).join('');
    }

    async function addToWhitelist() {
        const ip = document.getElementById('whitelistIp').value.trim();
        if (!ip) return alert('الرجاء إدخال IP');
        const res = await fetch('/api/whitelist/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ip: ip})
        });
        const data = await res.json();
        if (data.status === 'success') {
            showNotification(`✅ تم إضافة ${ip} إلى القائمة البيضاء`);
            document.getElementById('whitelistIp').value = '';
            loadWhitelist();
        } else {
            showNotification('❌ فشل الإضافة', 'error');
        }
    }

    async function removeFromWhitelist(ip) {
        if (!confirm(`هل تريد إزالة ${ip} من القائمة البيضاء؟`)) return;
        const res = await fetch('/api/whitelist/remove', {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ip: ip})
        });
        const data = await res.json();
        if (data.status === 'success') {
            showNotification(`✅ تم إزالة ${ip} من القائمة البيضاء`);
            loadWhitelist();
        } else {
            showNotification('❌ فشل الإزالة', 'error');
        }
    }

    function showNotification(msg, type='success') {
        const div = document.createElement('div');
        div.className = 'notification';
        div.style.background = type === 'error' ? '#f44336' : '#4caf50';
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    loadWhitelist();
</script>
</body>
</html>
